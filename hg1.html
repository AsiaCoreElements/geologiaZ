<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hydrogeology: Groundwater Fundamentals</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:#FFF;color:#15171A;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}button{font-family:inherit}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid #F1F5F9;margin-bottom:20px}.segment{display:inline-flex;gap:4px;padding:4px;background:#F1F5F9;border-radius:12px}.mode{height:32px;padding:0 12px;font-size:12px;font-weight:700;border-radius:8px;border:0;cursor:pointer;background:transparent;color:#64748B}.mode.active{background:#FFF;color:#15171A;box-shadow:0 1px 2px #0001}.controls{display:flex;align-items:center;gap:12px}.score{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.reset,.save{height:32px;padding:0 12px;font-size:12px;font-weight:700;color:#475569;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}.step-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.steps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;flex:1}.step{width:40px;height:40px;border-radius:16px;border:2px solid #E2E8F0;background:#F8FAFC;color:#475569;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}.step.correct{background:#ECFDF5;color:#065F46;border-color:#059669}.step.wrong{background:#FEF2F2;color:#991B1B;border-color:#DC2626}.step.active{background:#C2410C;color:#FFF;border-color:transparent}.save{height:36px;color:#64748B;white-space:nowrap}.save.saved{background:#FEFCE8;border-color:#CA8A04;color:#A16207}.q-meta{font-size:12px;font-weight:700;color:#0284C7;margin-bottom:10px}.q-heading{font-family:'Tajawal',sans-serif;font-size:20px;font-weight:700;line-height:1.35;margin:0 0 16px}.options{display:flex;flex-direction:column;gap:10px}.opt-btn{width:100%;min-height:54px;text-align:left;padding:14px;font-size:14px;font-weight:500;border-radius:16px;background:#FFF;border:2px solid #E2E8F0;border-bottom-width:4px;color:#15171A;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s ease}.opt-btn:not(:disabled):hover{border-color:#0284C7}.opt-btn:not(:disabled):active{border-bottom-width:2px;transform:translateY(2px)}.keycap{width:32px;height:32px;border-radius:12px;font-size:12px;font-weight:800;background:#F1F5F9;color:#334155;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.opt-btn.correct{background:#ECFDF5;border:2px solid #059669;border-bottom-width:4px;color:#065F46;font-weight:700}.opt-btn.correct .keycap{background:#059669;color:#FFF}.opt-btn.wrong{background:#FEF2F2;border:2px solid #DC2626;border-bottom-width:4px;color:#991B1B;font-weight:600}.opt-btn.wrong .keycap{background:#DC2626;color:#FFF}.opt-btn.muted{background:#F8FAFC;border:1px solid #E2E8F0;color:#94A3B8}.opt-btn.muted .keycap{background:#F1F5F9;color:#94A3B8}.explanation{margin-top:16px;padding:16px;background:#F0F9FF;border:1px solid #BAE6FD;border-radius:16px;font-size:13.5px;color:#0C4A6E;line-height:1.6}.bottom-nav{margin-top:20px;padding-top:16px;border-top:1px solid #F1F5F9;display:flex;align-items:center;justify-content:space-between;gap:12px}.nav{height:44px;padding:0 16px;font-size:12px;font-weight:700;color:#15171A;background:#F1F5F9;border:0;border-radius:16px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}.nav.next{padding:0 20px;color:#FFF;background:#C2410C}.nav:disabled{opacity:.4;cursor:default}.all-question{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid #F1F5F9}.small{font-size:12px;color:#64748B;line-height:1.5;margin-top:14px}.summary{padding:16px;border-radius:16px;background:#F8FAFC;border:1px solid #E2E8F0;margin-top:18px}@media(max-width:520px){body{padding:16px}.controls{width:100%;justify-content:space-between}.steps{gap:6px}.opt-btn{gap:10px;padding:12px}}
</style></head><body>
<div class="toolbar"><div class="segment"><button id="stepMode" class="mode active">Step-by-Step</button><button id="allMode" class="mode">All Questions</button></div><div class="controls"><div class="score" id="score">Score: 0 / 15</div><button class="reset" id="reset"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11a9 9 0 1 0 3-6.7L3 7"/><path d="M3 3v4h4"/></svg>Reset</button></div></div>
<div id="stepView"><div class="step-row"><div class="steps" id="steps"></div><button class="save" id="save"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg><span>Save</span></button></div><div id="questionArea"></div><div class="bottom-nav"><button class="nav" id="prev">← Previous</button><button class="nav next" id="next">Next Question →</button></div></div><div id="allView" hidden></div>
<p class="small">Hydrogeology practice · 15 multiple-choice questions. Choose an answer to reveal the explanation. Reset shuffles question and answer order.</p>
<script>
const bank=[
["Groundwater Basics","Which term describes the proportion of a rock's total volume occupied by voids?",["Hydraulic conductivity","Porosity","Transmissivity","Specific yield"],1,"Porosity is the ratio of void volume to total bulk volume; it describes storage space, not necessarily how easily water moves."],
["Groundwater Flow","For saturated flow through a porous medium, Darcy's law is commonly expressed as:",["Q = K i A","Q = K A / i","Q = i / (K A)","Q = K + i + A"],0,"Darcy's law gives Q = K i A, where K is hydraulic conductivity, i is hydraulic gradient, and A is the cross-sectional area perpendicular to flow."],
["Aquifer Types","The upper saturated boundary of an unconfined aquifer is the:",["Aquiclude","Potentiometric surface only","Water table","Capillary fringe base in all cases"],2,"The water table marks the upper surface of the saturated zone in an unconfined aquifer."],
["Hydraulic Properties","Transmissivity (T) of a uniform aquifer is hydraulic conductivity (K) multiplied by:",["Hydraulic gradient","Saturated thickness (b)","Effective porosity","Pumping duration"],1,"For a reasonably uniform aquifer, T = Kb, where b is saturated aquifer thickness."],
["Wells and Pumping","The decline in water level caused by pumping, relative to its initial level, is called:",["Recharge","Drawdown","Specific retention","Capillary rise"],1,"Drawdown is the reduction in hydraulic head due to pumping, measured relative to the initial water level."],
["Aquifer Testing","Which field test estimates aquifer properties from discharge and water-level changes over time?",["Slake durability test","Schmidt hammer test","Pumping test","Atterberg limits test"],2,"A pumping test records pumping rate and drawdown over time to estimate properties such as transmissivity and storativity."],
["Groundwater Storage","Specific yield is the fraction of a saturated material's bulk volume that:",["Drains under gravity","Consists only of clay minerals","Includes all pores and bound water","Transmits water regardless of gradient"],0,"Specific yield represents water that drains under gravity; it is generally lower than total porosity because some water is retained."],
["Recharge","Which process is a major natural source of recharge for many groundwater systems?",["Evaporation from soil","Pumping from a production well","Infiltration and downward percolation of precipitation","Groundwater discharge to a spring"],2,"Precipitation can infiltrate the soil and percolate through the unsaturated zone to the water table."],
["Hydraulic Head","Total hydraulic head in groundwater is commonly the sum of:",["Elevation head and pressure head","Porosity and permeability","Temperature and salinity","Recharge and discharge"],0,"In most porous-aquifer applications, total hydraulic head is elevation head plus pressure head; velocity head is usually negligible."],
["Groundwater Flow Maps","Groundwater flow in a simple isotropic aquifer is generally from:",["Lower head toward higher head","Higher head toward lower head","Lower porosity toward higher porosity only","Older rocks toward younger rocks"],1,"Groundwater flows down the hydraulic-head gradient. Water-table or potentiometric contours help infer flow direction."],
["Confined Aquifers","A confined aquifer is typically:",["Unsaturated through its entire thickness","Open to the atmosphere across its whole upper surface","Bounded by confining layers and under pressure","Composed exclusively of impermeable clay"],2,"A confined aquifer is bounded by lower-permeability confining units and groundwater is under pressure; water in a well may rise above the aquifer roof."],
["Hydraulic Conductivity","Hydraulic conductivity depends on the porous medium and on:",["Fluid properties such as viscosity and density","The color of sediment alone","The age of the aquifer alone","Well depth alone in every case"],0,"Hydraulic conductivity reflects both pore structure and fluid properties, including viscosity and density."],
["Water Quality","A groundwater sample with pH 5.5 is described as:",["Neutral","Alkaline","Acidic","A measure of transmissivity"],2,"On the usual pH scale, values below 7 are acidic, 7 is neutral, and values above 7 are alkaline."],
["Groundwater Chemistry","Total dissolved solids (TDS) primarily indicates:",["Groundwater flow direction","The combined concentration of dissolved substances","Depth to the water table","Aquifer saturated thickness"],1,"TDS represents dissolved material in water, commonly reported in mg/L; it does not directly indicate flow direction or aquifer thickness."],
["Fractured Aquifers","Crystalline rock with low matrix permeability may still yield groundwater where it contains:",["Well-connected open fractures","Only sealed fractures","No hydraulic gradient","Completely cemented pores and no openings"],0,"Open, interconnected fractures can provide secondary permeability through otherwise low-permeability crystalline rock."]
];
let qs=[],cur=0,answers={},saved=new Set();
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){qs=shuffle(bank.map(x=>({topic:x[0],q:x[1],opts:shuffle(x[2].map((label,i)=>({label,ok:i===x[3]}))),exp:x[4]})));cur=0;answers={};saved=new Set();$("stepMode").classList.add("active");$("allMode").classList.remove("active");$("stepView").hidden=false;$("allView").hidden=true;drawSteps();drawQuestion();score()}
function score(){$("score").textContent=`Score: ${Object.values(answers).filter(a=>a.ok).length} / ${qs.length}`}
function drawSteps(){let root=$("steps");root.innerHTML="";qs.forEach((q,i)=>{let b=document.createElement("button");b.className="step";b.textContent=i+1;if(answers[i])b.classList.add(answers[i].ok?"correct":"wrong");if(i===cur)b.classList.add("active");b.onclick=()=>{cur=i;drawQuestion();drawSteps()};root.append(b)});$("save").classList.toggle("saved",saved.has(cur));$("save").querySelector("span").textContent=saved.has(cur)?"Saved":"Save"}
function drawQuestion(){let q=qs[cur],old=answers[cur],area=$("questionArea");area.innerHTML=`<div class="q-meta">Question ${cur+1} of ${qs.length} · ${q.topic}</div><h2 class="q-heading">${q.q}</h2><div class="options" id="options"></div><div id="explanation"></div>`;q.opts.forEach((o,i)=>{let b=document.createElement("button");b.className="opt-btn";b.innerHTML=`<span class="keycap">${"ABCD"[i]}</span><span>${o.label}</span>`;if(old){b.disabled=true;if(o.ok)b.classList.add("correct");else if(i===old.index)b.classList.add("wrong");else b.classList.add("muted")}else b.onclick=()=>answer(i);$("options").append(b)});if(old)$("explanation").innerHTML=`<div class="explanation"><strong>Explanation: </strong>${q.exp}</div>`;$("prev").disabled=cur===0;$("next").disabled=cur===qs.length-1;$("next").innerHTML=cur===qs.length-1?"Last Question ✓":"Next Question →";drawSteps()}
function answer(i){if(answers[cur])return;answers[cur]={index:i,ok:qs[cur].opts[i].ok};drawQuestion();score()}
$("prev").onclick=()=>{if(cur>0){cur--;drawQuestion()}};$("next").onclick=()=>{if(cur<qs.length-1){cur++;drawQuestion()}};$("save").onclick=()=>{saved.has(cur)?saved.delete(cur):saved.add(cur);drawSteps()};$("reset").onclick=init;
$("stepMode").onclick=()=>{$("stepMode").classList.add("active");$("allMode").classList.remove("active");$("stepView").hidden=false;$("allView").hidden=true;drawQuestion()};
$("allMode").onclick=()=>{$("allMode").classList.add("active");$("stepMode").classList.remove("active");$("stepView").hidden=true;$("allView").hidden=false;drawAll()};
function drawAll(){let root=$("allView");root.innerHTML="";qs.forEach((q,i)=>{let s=document.createElement("section");s.className="all-question";let m=document.createElement("div");m.className="q-meta";m.textContent=`Question ${i+1} of ${qs.length} · ${q.topic}`;let h=document.createElement("h2");h.className="q-heading";h.textContent=q.q;let opts=document.createElement("div");opts.className="options";q.opts.forEach((o,j)=>{let b=document.createElement("button");b.className="opt-btn";b.innerHTML=`<span class="keycap">${"ABCD"[j]}</span><span>${o.label}</span>`;if(answers[i]){b.disabled=true;if(o.ok)b.classList.add("correct");else if(j===answers[i].index)b.classList.add("wrong");else b.classList.add("muted")}else b.onclick=()=>{answers[i]={index:j,ok:o.ok};cur=i;score();drawAll();drawSteps()};opts.append(b)});s.append(m,h,opts);if(answers[i]){let e=document.createElement("div");e.className="explanation";e.innerHTML=`<strong>Explanation: </strong>${q.exp}`;s.append(e)}root.append(s)});let summary=document.createElement("div");summary.className="summary";summary.textContent=`Answered: ${Object.keys(answers).length}/${qs.length} · `+$("score").textContent;root.append(summary)}
init();
</script></body></html>
