    }

    }

      margin-bottom: 14px;
      line-height: 1.4;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      border-bottom-width: 4px;
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #15171A;

      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s ease;

      border-color: #0284C7;
      background: #F0F9FF;
    }
    .option-btn:disabled {
      cursor: default;
    }
    .letter-badge {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: #F1F5F9;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
      color: #15171A;
    }
    .option-btn.correct {
      background: #ECFDF5;
      border-color: #059669;
      color: #065F46;
      font-weight: 700;
    }
    .option-btn.correct .letter-badge {
      background: #059669;
      color: #FFFFFF;
    }
    .option-btn.wrong {
      background: #FEF2F2;
      border-color: #DC2626;
      color: #991B1B;
      font-weight: 600;
    }
    .option-btn.wrong .letter-badge {
      background: #DC2626;
      color: #FFFFFF;
    }
    .explanation-box {
      display: none;
      background: #F0F9FF;
      border: 1px solid #BAE6FD;
      color: #0C4A6E;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.55;
    }
    .explanation-box.visible {
      display: block;
    }
    .footer-actions {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }
    .reset-btn {
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      border-bottom-width: 4px;
      border-radius: 16px;
      padding: 12px 24px;
      font-family: 'Tajawal', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #15171A;

    .reset-btn:hover {
      border-color: #0284C7;
      background: #F0F9FF;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .main-container {
        padding: 16px;
        border-radius: 20px;
      }

      }

  </style>
</head>

      },
      {
        q: "In the Archaean basement complex of the Bastar Craton, how are the Sukma, Amgaon, and Bengpal supracrustal groups distinguished in terms of age and metamorphic grade?",

    const quizContainer = document.getElementById('quiz-container');
    const scoreCounter = document.getElementById('score-counter');
    const answeredCounter = document.getElementById('answered-counter');
    const progressFill = document.getElementById('progress-fill');
    const resetBtn = document.getElementById('reset-btn');

    let score = 0;
    let answeredCount = 0;
    const totalQuestions = quizData.length;
    const letters = ['A', 'B', 'C', 'D'];

    function renderQuiz() {
      quizContainer.innerHTML = '';
      score = 0;
      answeredCount = 0;
      updateHeader();

      quizData.forEach((item, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const meta = document.createElement('div');
        meta.className = 'q-meta';
        meta.textContent = `Question ${qIndex + 1} of ${totalQuestions}`;

        const title = document.createElement('div');
        title.className = 'q-title';
        title.textContent = item.q;

        const optionsList = document.createElement('div');
        optionsList.className = 'options-list';

        const expBox = document.createElement('div');
        expBox.className = 'explanation-box';
        expBox.innerHTML = `<strong>Explanation:</strong> ${item.explanation}`;

        item.options.forEach((optText, optIndex) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option-btn';

          const badge = document.createElement('span');
          badge.className = 'letter-badge';
          badge.textContent = letters[optIndex];

          const textSpan = document.createElement('span');
          textSpan.textContent = optText;

          btn.appendChild(badge);
          btn.appendChild(textSpan);

          btn.addEventListener('click', () => {
            const allBtns = optionsList.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            answeredCount++;
            if (optIndex === item.correct) {
              btn.classList.add('correct');
              score++;
            } else {
              btn.classList.add('wrong');
              allBtns[item.correct].classList.add('correct');
            }

            expBox.classList.add('visible');
            updateHeader();
          });

          optionsList.appendChild(btn);
        });

        card.appendChild(meta);
        card.appendChild(title);
        card.appendChild(optionsList);
        card.appendChild(expBox);
        quizContainer.appendChild(card);
      });
    }

    function updateHeader() {
      scoreCounter.textContent = `Score: ${score} / ${totalQuestions}`;
      answeredCounter.textContent = `Answered: ${answeredCount} / 15`;
      const pct = Math.round((answeredCount / totalQuestions) * 100);
      progressFill.style.width = `${pct}%`;
    }

    resetBtn.addEventListener('click', () => {
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    renderQuiz();
  </script>
</body>
</html>
